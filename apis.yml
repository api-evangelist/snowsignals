name: SnowSignals
description: >-
  SnowSignals is a crypto market-data platform (data-as-a-service) whose TrendVane product serves
  multi-timeframe market-phase (regime) classifications — market state, not trade signals — for
  BTC, ETH, GRAM, SOL and TRX over a metered REST API and a hosted, OAuth-gated MCP server.
  Pricing is prepaid in stablecoin and served in-band by a free, no-auth discovery call, so an
  agent can compute the exact cost of a read before spending; a free phase-resolution model
  (successor-transition probabilities, continuation rates, MFE/MAE) supports interpreting each
  reading. The platform is deliberately agent-native: first-party llms.txt, self-hosted APIs.json,
  RFC 8414/9728 OAuth discovery, and an official MCP registry listing. A first-party x402
  gateway (pay.snowsignals.io, live 2026-09-10) additionally sells the same phase reads
  pay-per-call in USDC on Base with no account at all.

pricing: 'Metered per call from a prepaid stablecoin balance. Pricing model is served in-band by list_phase_meta:
  base rate 2314 micro-USD per row (currency x timeframe), multiplier 1.25 for 1 row, 1.15 for 2-5, 1.00
  for 6+. See ../plans/snowsignals-plans-pricing.yml.'
tool_count: 8
tools_list_capture: snowsignals-mcp-tools-list.json
tools:
- name: list_phase_meta
  category: discovery
  auth: none
  description: Free, no account. Lists phases, timeframes, currencies, a card per phase, and the live
    pricing model so an agent can price a paid call before making it.
- name: phase_resolution_stats
  category: discovery
  auth: none
  description: Free. Per-phase successor-transition probabilities, trend-continuation rates, and MFE/MAE
    reward-vs-drawdown, each with its sample count (BTC research model, 2022-2026 regime).
- name: get_notifications
  category: account
  auth: oauth2 (daas:read)
  description: Read-only account messages (support, billing, account notices), cursor-paged per category.
    Never marks anything read.
- name: get_balance
  category: account
  auth: oauth2 (daas:read)
  description: Prepaid balance, holds, bonus credit and expiry, pause state, current pricing, and the
    deposit addresses on the account.
- name: get_usage
  category: account
  auth: oauth2 (daas:read)
  description: History of paid calls, newest first, cursor-paged with `before`.
- name: deposit_poll
  category: account
  auth: oauth2 (daas:read)
  description: Nudges the system to re-scan deposit addresses after a stablecoin deposit. Moves no money;
    free.
- name: get_phase
  category: data (metered)
  auth: oauth2 (daas:read)
  description: Current market phase for one currency across timeframes; kind=boundary (settled last closed
    bar) or updates (intra-bar). Required args currency, kind.
- name: compose_phases
  category: data (metered)
  auth: oauth2 (daas:read)
  description: Phases for several currencies and timeframes in one call; cost scales with rows returned
    (currencies x tfs). Required args currencies, tfs, kind.

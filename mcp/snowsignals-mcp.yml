tools:
- name: trendvane_list_phase_meta
  description: The tool to call first, and it's free with no account. Lists the phases the model can report,
    the timeframes and currencies covered, and a short card for each phase explaining what it means and
    what tends to come next. Also returns the current pricing, so you can work out what a paid call costs
    before you make one.
- name: trendvane_phase_resolution_stats
  description: Free, and how you read meaning into a phase. For each one it shows what usually happens
    next, how often a trend keeps running, and how the typical move rewarded you against how far it drew
    down first. Every figure comes with the number of past cases behind it. It's a behavior model built
    from years of Bitcoin history, not live per-coin data, so pair it with trendvane_get_phase.
- name: system_get_notifications
  description: 'Read your account messages: support, billing, and account notices. With no arguments you
    get the ten most recent in each group, each with a cursor; pass a category and cursor to page further
    back. It''s read-only and free, and it never marks anything as read. Security alerts aren''t available
    here, and any group you''ve switched off for API access won''t show up.'
- name: system_get_balance
  description: Check your prepaid balance before a paid call. Shows the credit you have left to spend,
    anything on hold, any bonus credit and when it expires, whether the account is paused, the current
    pricing, and the deposit addresses on your account. It's free. If you run out, paid calls are turned
    away until you top up. To add a deposit address, sign in to the web dashboard.
- name: system_get_usage
  description: Your history of paid calls, newest first. For each one it shows which tool you used, the
    coins and timeframes, how much data came back, and what it cost. Free. Page back through older calls
    with `before`, using the cursor the previous page returned.
- name: system_deposit_poll
  description: 'Call this right after you send a stablecoin deposit to have it picked up sooner: it tells
    the system to check your deposit addresses now. It moves no money and is free. If it comes back with
    nothing, you don''t have a deposit address yet, so add one from the web dashboard.'
- name: trendvane_get_phase
  description: Get the current market phase for one coin, across a timeframe. This is a paid call. Set
    `kind` to 'boundary' for the reading from the last closed bar, which is settled and won't change,
    or 'updates' for the live reading still forming inside the current bar. Leave `tf` off, or set it
    to 'all', for every timeframe.
- name: trendvane_compose_phases
  description: Get phases for several coins and timeframes in one paid call. Set `kind` to 'boundary'
    for the settled last-closed-bar reading or 'updates' for the still-forming one. The cost scales with
    how many readings come back, which is your coins times your timeframes.
- name: bfxpremium_get_premium
  description: 'Get the Bitfinex cross-exchange premium for BTC: the latest CLOSED daily residual (in
    basis points) and its regime state (calm, building, or stress). This is a paid call at a flat per-call
    price. Set `updates` to true to also append the rolling intra-day reading from the last closed sub-daily
    bucket; the price is the same either way. If a required exchange is unavailable the call returns an
    error and is not charged.'
notes: 'A third-party-shaped but first-party-published resale path also exists: snowkidind/snowsignals-x402,
  a Cloudflare Worker reselling phase reads per call over x402 (USDC on Base), intended for pay.snowsignals.io
  — that host currently answers 404 (probed 2026-09-10), so it is not yet a live surface and no pointer
  is emitted for it.'
